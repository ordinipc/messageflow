; Limiti consigliati per il caricamento dell export WordPress.
; Molti hosting condivisi (PHP in modalità CGI/FPM) leggono questo file da soli;
; se il tuo non lo fa, imposta gli stessi valori dal pannello PHP dell hosting.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 300
