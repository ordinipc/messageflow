<!-- PWA Service Worker + Install -->
<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js', { scope: '/app/accounting/' })
            .then(function(reg) {
                console.log('[PWA] Service Worker registrato, scope:', reg.scope);
            })
            .catch(function(err) {
                console.log('[PWA] SW registrazione fallita:', err);
            });
    });
}

var deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
    try { if (localStorage.getItem('pwa_banner_dismissed')) return; } catch(ex) {}
    showInstallBanner();
});

function showInstallBanner() {
    if (document.getElementById('pwa-install-banner')) return;
    var banner = document.createElement('div');
    banner.id = 'pwa-install-banner';
    banner.innerHTML = 
        '<div style="position:fixed;bottom:70px;left:10px;right:10px;background:linear-gradient(135deg,#38a169,#276749);color:#fff;padding:14px 16px;border-radius:14px;box-shadow:0 6px 30px rgba(56,161,105,.5);z-index:10000;display:flex;align-items:center;gap:12px;animation:slideUpBanner .4s ease">' +
            '<div style="font-size:2rem;flex-shrink:0">📊</div>' +
            '<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:.9rem;margin-bottom:2px">Installa Contabilità Pro</div><div style="font-size:.75rem;opacity:.85">Accedi rapidamente dalla schermata Home</div></div>' +
            '<button onclick="installPWA()" style="background:#fff;color:#38a169;border:none;padding:8px 16px;border-radius:8px;font-weight:700;font-size:.8rem;cursor:pointer;white-space:nowrap;flex-shrink:0">Installa</button>' +
            '<button onclick="dismissInstallBanner()" style="background:none;border:none;color:rgba(255,255,255,.7);font-size:1.2rem;cursor:pointer;padding:4px;flex-shrink:0">✕</button>' +
        '</div>';
    var style = document.createElement('style');
    style.textContent = '@keyframes slideUpBanner{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}';
    document.head.appendChild(style);
    document.body.appendChild(banner);
}

function installPWA() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(result) {
        if (result.outcome === 'accepted' && typeof showToast === 'function') {
            showToast('✅ App installata con successo!', 'success');
        }
        deferredPrompt = null;
        dismissInstallBanner();
    });
}

function dismissInstallBanner() {
    try { localStorage.setItem('pwa_banner_dismissed', '1'); } catch(ex) {}
    var banner = document.getElementById('pwa-install-banner');
    if (banner) {
        banner.style.transition = 'opacity .3s, transform .3s';
        banner.style.opacity = '0';
        banner.style.transform = 'translateY(30px)';
        setTimeout(function() { banner.remove(); }, 300);
    }
}
</script>
